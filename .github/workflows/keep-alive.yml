name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 5 minutes (GitHub Actions minimum is 5 min)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    name: Ping Render Health Endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Ping /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://darukaa-backend-dvch.onrender.com/health)
          echo "Response status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "WARNING: Backend returned non-200 status: $STATUS"
            exit 1
          else
            echo "Backend is alive and healthy!"
          fi
